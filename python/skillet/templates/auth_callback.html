{% extends "base.html" %}
{% block title %}Finishing sign-in — Skillet{% endblock %}
{% block content %}
<div class="auth-wrap center">
  <div class="card card-pad">
    <h1 style="font-size:1.3rem">Finishing sign-in…</h1>
    <p class="muted" id="cb-status">Hang tight while we complete your sign-in.</p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function () {
  var statusEl = document.getElementById('cb-status');
  var params = new URLSearchParams(window.location.search);
  var hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  var body = { next: params.get('next') || '/cookbooks' };
  if (params.get('code')) {
    body.code = params.get('code');
  } else if (hash.get('access_token') && hash.get('refresh_token')) {
    body.access_token = hash.get('access_token');
    body.refresh_token = hash.get('refresh_token');
  } else {
    statusEl.textContent = 'This sign-in link is missing its code. Try signing in again.';
    return;
  }
  fetch('/auth/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': {{ csrf_token | tojson }} },
    body: JSON.stringify(body)
  }).then(function (res) {
    return res.json().then(function (data) { return { ok: res.ok, data: data }; });
  }).then(function (r) {
    if (!r.ok) {
      statusEl.textContent = r.data.error || 'Could not finish signing in.';
      return;
    }
    window.location.replace(r.data.next || '/cookbooks');
  }).catch(function () {
    statusEl.textContent = 'Something went wrong. Try signing in again.';
  });
})();
</script>
{% endblock %}
